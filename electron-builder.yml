appId: com.taktil.notes
productName: Taktil Notes
publish:
  provider: github
  owner: Abdanio
  repo: taktil-notes
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Taktil Notes
mac:
  target:
    - dmg
    - zip
  icon: resources/icon.png
linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
